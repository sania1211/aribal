
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SANIÉ ATELIER</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 25px 15px;

            background:
                radial-gradient(circle at 15% 20%, #D8C3A5 0px, transparent 180px),
                radial-gradient(circle at 85% 80%, #C8AE8A 0px, transparent 220px),
                linear-gradient(135deg, #F8F1E5, #E9DCC9);

            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            top: -100px;
            right: -80px;
        }

        body::after {
            content: "";
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(184, 149, 90, 0.15);
            bottom: -100px;
            left: -70px;
        }

        .login-box {
            position: relative;
            z-index: 2;
            width: 400px;
            max-width: 100%;
            padding: 30px 40px;
            background: #FFFFFF;
            border: 1px solid rgba(184, 149, 90, 0.3);
            border-radius: 22px;

            box-shadow:
                0 20px 50px rgba(74, 53, 37, 0.20);
        }

        /* LOGO */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo {
            width: 180px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #4A3525;
            font-size: 30px;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #8A7765;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #4A3525;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D5C5AE;
            border-radius: 10px;
            outline: none;
            background: #FFFDF8;
            font-size: 15px;
        }

        input:focus {
            border-color: #B8955A;
            box-shadow: 0 0 0 3px rgba(184, 149, 90, 0.12);
        }

        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .forgot a {
            color: #8A6A3F;
            text-decoration: none;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #4A3525;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #6B4B35;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #8A7765;
            font-size: 14px;
        }

        .signup a {
            color: #8A6A3F;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 450px) {
            .login-box {
                padding: 25px 22px;
            }

            .logo {
                width: 150px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- SANIÉ ATELIER LOGO -->
        <div class="logo-container">
            <img
                src="logo.png"
                alt="SANIÉ ATELIER Logo"
                class="logo">
        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">Please login to your account</p>

        
<form id="loginForm">

    <div class="input-box">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required>
    </div>

    <div class="input-box">
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required>
    </div>

    <p id="errorMessage" style="color: #b00020; text-align: center; margin-bottom: 15px; display: none;">
        Incorrect username or password. Please try again.
    </p>

    <div class="forgot">
        <a href="#">Forgot Password?</a>
    </div>

    <button type="submit" class="login-btn">
        LOG IN
    </button>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign Up</a>
    </div>

</form>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("errorMessage");

        if (username === "sania" && password === "12345") {
            window.location.href = "home.html";
        } else {
            errorMessage.style.display = "block";
        }
    });
</script>

    </div>

</body>
</html>
